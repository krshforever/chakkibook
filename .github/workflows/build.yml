name: Build Chakkibook Web App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Production Web App
        run: npm run build

      - name: Create Zip Package
        run: cd dist && zip -r ../chakkibook-v1-web.zip .

      - name: Upload Dist Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chakkibook-v1-web
          path: chakkibook-v1-web.zip
          retention-days: 30
