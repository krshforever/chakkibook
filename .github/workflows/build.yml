name: Build Chakkibook Web & Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Production App
        run: npm run build

      - name: Create Web Zip Package
        run: cd dist && zip -r ../chakkibook-v1-web.zip .

      - name: Add & Sync Capacitor Android
        run: |
          npx cap add android
          npx cap sync android
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.SEND_SMS" />' android/app/src/main/AndroidManifest.xml

      - name: Build Android APK (Gradle assembleDebug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Copy APK to Root
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Chakkibook-v1.apk

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chakkibook-v1-web
          path: chakkibook-v1-web.zip
          retention-days: 30

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chakkibook-v1-APK
          path: Chakkibook-v1.apk
          retention-days: 30
