name: Build Chakkibook Web & Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Production App
        run: npm run build

      - name: Add & Sync Capacitor Android
        run: |
          npx cap add android
          npx cap sync android
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.SEND_SMS" />' android/app/src/main/AndroidManifest.xml

      - name: Build Android APK (Gradle assembleDebug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Copy APK to Root
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Chakkibook-v3.apk

      - name: Create GitHub Release with APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v3.0 --yes || true
          git tag -d v3.0 || true
          git push origin :refs/tags/v3.0 || true
          gh release create v3.0 Chakkibook-v3.apk --title "Chakkibook V3 Release" --notes "Chakkibook V3 APK Build"
