name: Deploy Web to GitHub Pages

# The APK pipeline (build.yml) and this one are deliberately separate:
# this workflow never touches Java, Gradle or Capacitor, so a web deploy can
# never be blocked by an Android SDK problem, and it never cuts a Release.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A second push while the first is mid-flight cancels the
# older run rather than racing two artifact uploads at the same environment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # BASE_PATH is the whole reason a subpath deploy works. GitHub Pages serves
      # this repo at /chakkibook/, so every absolute asset URL has to carry that
      # prefix or the page loads index.html and 404s on its own JS.
      - name: Build web app for /chakkibook/
        env:
          BASE_PATH: /chakkibook/
        run: npm run build

      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
