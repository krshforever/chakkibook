<!DOCTYPE html>
<html lang="en" data-mode="chakki" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#F7F3EB" />
  <meta name="description" content="Chakkibook — Digital ledger and voice co-pilot for Atta Chakki flour mills and mustard oil expellers across rural India" />

  <!-- No emoji in here. The app ships on an APK whose entire visual identity is
       SVG icons plus a real type pairing; a stray 🌾 in the title is both a
       brand inconsistency and the thing the zero-emoji rule exists to prevent. -->
  <title>Chakkibook — Atta Chakki & Oil Mill Ledger</title>

  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="apple-touch-icon" href="/logo.png" />

  <!-- Fonts are progressive enhancement, not a dependency. The CSS stacks fall
       back to Georgia / system-ui, so an offline first launch still looks
       deliberate rather than broken. Kept on the CDN rather than bundled because
       the two families add ~180 kb to an APK that rural users download on a
       metered connection. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
